version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Next 14 reads tsconfig paths through the TypeScript JS API, which TypeScript 7 doesn't provide.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-config-next 14 supports ESLint 8 only; move with Next.js.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # @imgly/background-removal needs exactly onnxruntime-web 1.21.0.
      - dependency-name: onnxruntime-web
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
