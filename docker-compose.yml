services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veyra}
      POSTGRES_DB: veyra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra"]
      interval: 5s
      retries: 10

  # One-off: creates/updates tables and seeds the demo user, then exits.
  migrate:
    build: { context: ., target: builder }
    command: sh -c "npx prisma db push --skip-generate && npm run db:seed"
    environment:
      DATABASE_URL: postgresql://veyra:${POSTGRES_PASSWORD:-veyra}@db:5432/veyra
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://veyra:${POSTGRES_PASSWORD:-veyra}@db:5432/veyra
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  uploads:
